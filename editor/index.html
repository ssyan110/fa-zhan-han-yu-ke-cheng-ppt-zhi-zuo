<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>發展漢語 · 課程編輯器</title><link rel="stylesheet" href="editor.css"></head><body>
<header><a class="brand" href="#">發展漢語 <span>課程編輯器</span></a><input id="deck-title" aria-label="課程名稱" value="未命名課程"><span id="save-status" role="status">正在開啟…</span><button id="save">下載課程檔</button><button id="export">匯出簡報</button><button id="present" class="primary">開始放映 ▷</button></header>
<nav class="toolbar" aria-label="編輯工具"><button id="new">新課程</button><button id="open">開啟課程</button><button id="draft">匯入製作稿</button><span class="divider"></span><button id="undo" title="復原 Ctrl/⌘ Z">↶ 復原</button><button id="redo" title="重做 Ctrl/⌘ Shift Z">↷ 重做</button><span class="divider"></span><button data-add="text">＋ 文字</button><button id="add-image">＋ 圖片</button><button data-add="shape">＋ 色塊</button><button data-add="flashcard">＋ 翻牌</button><button data-add="reveal">＋ 答案</button><div class="toolbar-end"><label><input id="snap" type="checkbox" checked> 對齊格線</label><button id="print">列印 / PDF</button></div></nav>
<main><aside class="slides-pane"><div class="pane-heading"><h2>投影片</h2><button id="add-slide" aria-label="新增投影片">＋</button></div><div id="slide-list"></div><div class="slide-actions"><button id="slide-up" title="投影片上移">↑</button><button id="slide-down" title="投影片下移">↓</button><button id="copy-slide">複製</button><button id="delete-slide">刪除</button></div></aside>
<section class="workspace" aria-label="投影片工作區"><div class="workspace-heading"><span id="page-label">1 / 1</span><span>拖曳移動 · 拖曳右下角調整大小 · 雙擊編輯文字</span></div><div id="stage-wrap"><div id="stage" class="slide-canvas" tabindex="0" aria-label="投影片畫布"></div></div><div id="overflow" role="status"></div><details class="notes-panel"><summary>教師備註 <span>不會出現在放映中</span></summary><textarea id="notes" aria-label="教師備註" placeholder="記錄教學提示、原稿內容或待確認項目"></textarea></details></section>
<aside class="inspector"><div class="pane-heading"><h2>格式</h2><span id="selected-kind">投影片</span></div><section><label>投影片名稱<input id="slide-title"></label><label>課本來源<input id="source" placeholder="Sách giáo khoa P13–14"></label><label class="inline-label">畫布顏色<input id="slide-bg" type="color" value="#f8f7f3"></label></section><div id="no-selection">選取文字、圖片或卡片，即可調整位置與格式。</div><fieldset id="element-controls" hidden><legend>物件設定</legend><label>文字<textarea id="text" rows="5"></textarea></label><label id="back-label">背面 / 答案<textarea id="back-text" rows="3"></textarea></label><div class="grid"><label>X<input id="x" type="number" min="0" max="940"></label><label>Y<input id="y" type="number" min="0" max="520"></label><label>寬<input id="w" type="number" min="20" max="960"></label><label>高<input id="h" type="number" min="20" max="540"></label></div><div class="grid"><label>字級<input id="fontSize" type="number" min="8" max="150"></label><label>對齊<select id="align"><option value="left">靠左</option><option value="center">置中</option><option value="right">靠右</option></select></label><label>文字色<input id="color" type="color"></label><label>底色<input id="background" type="color"></label></div><label class="inline-label"><input id="bold" type="checkbox">粗體</label><label class="inline-label"><input id="locked" type="checkbox">鎖定位置</label><div class="grid"><button id="center-x">水平置中</button><button id="center-y">垂直置中</button><button id="front">移到最上層</button><button id="back">移到最下層</button><button id="duplicate">複製物件</button><button id="remove">刪除物件</button></div><button id="replace-image" hidden>替換圖片</button></fieldset></aside></main>
<div id="toast" role="status" hidden></div><input type="file" id="file" accept=".json" hidden><input type="file" id="md-file" accept=".md" hidden><input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<dialog id="presenter"><div id="present-wrap"><div id="present-stage" class="slide-canvas"></div></div><nav><button id="exit-present">結束放映 Esc</button><button id="fullscreen">全螢幕</button><button id="prev">← 上一頁</button><span id="present-count"></span><button id="next">下一頁 →</button></nav></dialog>
<dialog id="recent"><h2>開啟課程</h2><p>繼續編輯最近的課程，或開啟已下載的課程檔。</p><div id="recent-list"></div><div class="recent-actions"><button id="open-file">選擇課程檔</button><button id="close-recent">取消</button></div></dialog>
<script src="model.js"></script><script src="editor.js"></script></body></html>
